server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # API proxy -> backend service (same origin, so no CORS needed)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA: the service worker and its runtime chunks must never be cached,
    # otherwise clients get stuck on a stale worker.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location ~ ^/workbox-[0-9a-f]+\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Web app manifest
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        expires off;
    }

    # The HTML shell must be revalidated so new deploys roll out promptly.
    location = /index.html {
        add_header Cache-Control "no-cache";
        expires off;
    }
}